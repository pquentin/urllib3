name: CI
run-name: Stress test of ${{ inputs.ref || github.sha }}

# STRESS-TEST BRANCH ONLY, DO NOT MERGE.
#
# Replaces the regular CI jobs with a stress test: the whole test suite is run
# 100 times per pytest-xdist configuration on Windows, to check that the
# port-reuse flake between parallel tests does not come back.

on:
  push:
    branches: ["stress-flaky-unused-port-tests"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to test (default: the commit the workflow runs from)"
        required: false
        default: ""

permissions:
  contents: "read"

defaults:
  run:
    shell: bash
env:
  NO_COLOR: 1
  # Number of full test suite runs per job. The number of runs per xdist
  # configuration is ITERATIONS x Python versions x shards = 10 x 2 x 5 = 100.
  ITERATIONS: 10

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest"]
        python-version: ["3.10", "3.14"]
        # "auto" is what the regular CI uses (one worker per core, 4 on these
        # runners). "8" doubles the number of tests running at the same time.
        xdist-workers: ["auto", "8"]
        shard: [1, 2, 3, 4, 5]

    runs-on: ${{ matrix.os }}
    name: Stress ${{ matrix.os }} ${{ matrix.python-version }} -n ${{ matrix.xdist-workers }} (${{ matrix.shard }})
    timeout-minutes: 60
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0 # Needed to fetch the version from git
          persist-credentials: false

      - name: "Setup Python ${{ matrix.python-version }}"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          check-latest: true

      - name: "Install uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.7"

      - name: "Run tests ${{ env.ITERATIONS }} times"
        run: |
          mkdir -p stress-logs
          failed=0
          for i in $(seq 1 "$ITERATIONS"); do
            log="stress-logs/iteration-$i.log"
            echo "::group::Iteration $i of $ITERATIONS"
            # -R reuses the virtualenv created by the first iteration. The -n
            # given here overrides the "-n auto" set in noxfile.py.
            if uvx nox -R -s "$NOX_SESSION" -- -n "$XDIST_WORKERS" test/ 2>&1 | tee "$log"; then
              status=passed
              rm "$log"
            else
              status=FAILED
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
            echo "Iteration $i: $status"
            if [[ "$status" == FAILED ]]; then
              {
                echo "### Iteration $i failed"
                echo '```'
                grep -E "^(FAILED|ERROR) " "$log" || tail -n 20 "$log"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "$failed of $ITERATIONS iterations failed" | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$failed" -eq 0 ]]
        env:
          NOX_SESSION: test-${{ matrix.python-version }}
          XDIST_WORKERS: ${{ matrix.xdist-workers }}

      - name: "Upload logs of failed iterations"
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-logs-${{ matrix.python-version }}-n${{ matrix.xdist-workers }}-${{ matrix.shard }}
          path: stress-logs/
          if-no-files-found: ignore
